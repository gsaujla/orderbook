name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug-asan, release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so CI and local formatting agree; install the same version locally with
      # `pip install clang-format==19.1.7`.
      - name: Install clang-format
        run: pip install clang-format==19.1.7
      - name: Check formatting
        run: |
          find include src test feed bench -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror
